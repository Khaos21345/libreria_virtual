{% extends 'libreria_db/base.html' %}

{% block title %}Editar - {{ libro.titulo }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-warning text-dark py-3">
                <h4 class="card-title mb-0 fs-5">Editar Libro</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="titulo" class="form-label fw-semibold">Título del Libro</label>
                        <input type="text" name="titulo" id="titulo" class="form-control" value="{{ libro.titulo }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="autor" class="form-label fw-semibold">Autor</label>
                        <input type="text" name="autor" id="autor" class="form-control" value="{{ libro.autor }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label fw-semibold">Descripción</label>
                        <textarea name="descripcion" id="descripcion" rows="4" class="form-control">{{ libro.descripcion }}</textarea>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" name="disponible" id="disponible" {% if libro.disponible %}checked{% endif %}>
                        <label for="disponible">Disponible</label>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{% url 'inicio' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-warning px-4">Actualizar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
