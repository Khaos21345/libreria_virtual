{% extends 'libreria_db/base.html' %}

{% block title %}Agregar Libro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="card-title mb-0 fs-5">Registrar Nuevo Libro</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="titulo" class="form-label fw-semibold">Título del Libro</label>
                        <input type="text" name="titulo">
                    </div>

                    <div class="mb-3">
                        <label for="autor" class="form-label fw-semibold">Autor</label>
                        <input type="text" name="autor">
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label fw-semibold">Descripción / Resumen</label>
                        <textarea name="descripcion"></textarea>
                    </div>

                    <div class="form-check mb-4">
                        <input type="checkbox" name="disponible" id="disponible" class="form-check-input" checked>
                        <label for="disponible" class="form-check-label">Disponible en inventario</label>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{% url 'inicio' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">Guardar Libro</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
