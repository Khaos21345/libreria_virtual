<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Librería Virtual | Rincón Literario{% endblock %}</title>
    
    <!-- Google Fonts: Playfair Display (estilo literario/clásico) y Inter (moderno) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --biblio-dark: #2c221e;       /* Marrón muy oscuro / madera noble */
            --biblio-accent: #c29b38;     /* Dorado envejecido / páginas antiguas */
            --biblio-bg: #f9f6f0;         /* Marfil suave / papel pergamino claro */
            --biblio-card-bg: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--biblio-bg);
            color: #3d332a;
        }

        h1, h2, h3, h4, h5, h6, .navbar-brand {
            font-family: 'Playfair Display', serif;
        }

        /* Navbar estilo biblioteca clásica / boutique */
        .navbar-custom {
            background-color: var(--biblio-dark);
            border-bottom: 3px solid var(--biblio-accent);
            padding: 0.8rem 0;
        }

        .navbar-brand {
            color: #f4efe1 !important;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        .navbar-brand i {
            color: var(--biblio-accent);
        }

        .nav-link {
            color: #d1c7bd !important;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--biblio-accent) !important;
        }

        /* Botón personalizado estilo vintage chic */
        .btn-custom-gold {
            background-color: var(--biblio-accent);
            color: #2c221e;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-custom-gold:hover {
            background-color: #d4ac42;
            color: #1a1412;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(194, 155, 56, 0.3);
        }

        /* Contenedor principal tipo tarjeta de lectura */
        .main-card {
            background-color: var(--biblio-card-bg);
            border: 1px solid #eae2d0;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(44, 34, 30, 0.05);
            padding: 2.5rem;
            margin-top: 2rem;
            margin-bottom: 3rem;
        }

        /* Footer elegante */
        footer {
            background-color: #f0ece1;
            border-top: 1px solid #e2dac9;
            color: #6c6052;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">
                <i class="fa-solid fa-book-open-reader me-2"></i>Librería Virtual
            </a>
            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item px-2">
                        <a class="nav-link" href="{% url 'inicio' %}">
                            <i class="fa-solid fa-books me-1"></i> Catálogo
                        </a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-custom-gold px-3 py-2 rounded-pill shadow-sm" href="{% url 'crear_libro' %}">
                            <i class="fa-solid fa-plus-circle me-1"></i> Nuevo Libro
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Dinámico envuelto en una tarjeta estética -->
    <main class="container flex-grow-1">
        <div class="main-card">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="mt-auto py-4 text-center">
        <div class="container">
            <p class="mb-1 fw-semibold" style="font-family: 'Playfair Display', serif; color: var(--biblio-dark);">
                <i class="fa-solid fa-feather text-warning me-1"></i> El refugio de las grandes historias
            </p>
            <small class="text-muted">&copy; {% now "Y" %} Librería Virtual — Sistema de Gestión CRUD</small>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Seleccionamos todos los inputs de texto y textareas del sistema
        const campos = document.querySelectorAll('input[type="text"], textarea');

        campos.forEach(campo => {
            // Forzamos el maxlength por seguridad nativa
            campo.setAttribute('maxlength', '30');

            // Interceptamos cada vez que el usuario presiona una tecla
            campo.addEventListener('keydown', function(e) {
                // Permitimos teclas de control como Borrar (Backspace), Tab, Flechas, etc.
                const teclasControl = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter'];
                if (teclasControl.includes(e.key)) {
                    return;
                }

                // Si ya llegó a 30 caracteres y no está seleccionando texto para reemplazar, bloqueamos la tecla
                if (this.value.length >= 30 && this.selectionStart === this.selectionEnd) {
                    e.preventDefault();
                }
            });

            // Por si acaso pegan texto con el mouse (paste)
            campo.addEventListener('input', function() {
                if (this.value.length > 30) {
                    this.value = this.value.substring(0, 30);
                }
            });
        });
    });
</script>
</body>
</html>
